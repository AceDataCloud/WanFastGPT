name: Plugin validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm run type-check
      - run: pnpm run build
      - run: pnpm run check
      - run: pnpm exec fastgpt-plugin pack --entry . --dist ./dist --output ./out
      - uses: actions/upload-artifact@v4
        with:
          name: fastgpt-plugin-package
          path: out/*.pkg
          if-no-files-found: error
          retention-days: 7
